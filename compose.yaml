name: adversarial-cooperation

x-toolchain-environment: &toolchain-environment
  AC_CONTAINER_CONTEXT: adversarial-cooperation-toolchain-v1
  AC_BASE_IMAGE: debian:13.6-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
  AC_RUN_ID: ${AC_RUN_ID:-local}
  AC_UID: ${AC_UID:-65532}
  AC_GID: ${AC_GID:-65532}

x-toolchain: &toolchain
  image: debian:13.6-slim@sha256:020c0d20b9880058cbe785a9db107156c3c75c2ac944a6aa7ab59f2add76a7bd
  user: "0:0"
  working_dir: /
  entrypoint:
    - /bin/bash
    - /bootstrap/setup.sh
  environment: *toolchain-environment
  privileged: false
  read_only: false
  restart: "no"
  pids_limit: 1024
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - FSETID
    - SETFCAP
    - SETGID
    - SETPCAP
    - SETUID
  tmpfs:
    - /tmp:rw,nosuid,nodev,exec,mode=1777,size=4g
    - /run:rw,nosuid,nodev,noexec,mode=755,size=16m
  volumes:
    - type: bind
      source: ./setup.sh
      target: /bootstrap/setup.sh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./compose.yaml
      target: /bootstrap/compose.yaml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./Makefile.config
      target: /source/Makefile.config
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./book
      target: /source/book
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./compile_latex.sh
      target: /source/compile_latex.sh
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./demostrations
      target: /source/demostrations
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./document
      target: /source/document
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./include
      target: /source/include
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./src
      target: /source/src
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./test-vectors
      target: /source/test-vectors
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./tests
      target: /source/tests
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./web
      target: /source/web
      read_only: true
      bind:
        create_host_path: false

services:
  toolchain:
    <<: *toolchain
    volumes:
      - type: bind
        source: ./setup.sh
        target: /bootstrap/setup.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./compose.yaml
        target: /bootstrap/compose.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./Makefile.config
        target: /source/Makefile.config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./book
        target: /source/book
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./compile_latex.sh
        target: /source/compile_latex.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./demostrations
        target: /source/demostrations
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./document
        target: /source/document
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./include
        target: /source/include
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./src
        target: /source/src
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./test-vectors
        target: /source/test-vectors
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tests
        target: /source/tests
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./web
        target: /source/web
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./.container-output
        target: /artifacts
        read_only: false
        bind:
          create_host_path: false
    command:
      - web

  preview:
    <<: *toolchain
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,mode=1777,size=4g
      - /run:rw,nosuid,nodev,noexec,mode=755,size=16m
      - /artifacts:rw,nosuid,nodev,noexec,mode=755,size=64m
    environment:
      <<: *toolchain-environment
      AC_RUN_ID: ${AC_PREVIEW_RUN_ID:-preview}
    command:
      - serve
    ports:
      - target: 4173
        published: "4173"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'const h=require("node:http");const r=h.get("http://127.0.0.1:4173/book/Adversarial-Cooperation.pdf",x=>{x.resume();process.exit(x.statusCode===200?0:1)});r.on("error",()=>process.exit(1));r.setTimeout(3000,()=>{r.destroy();process.exit(1)})'
      interval: 10s
      timeout: 5s
      retries: 12
      # A cold, Dockerfile-free setup may spend well over ten minutes fetching
      # Emscripten and TeX. Successful probes still make the service healthy
      # immediately; this window only prevents a truthful cold build from
      # being declared unhealthy before the server can exist.
      start_period: 30m
